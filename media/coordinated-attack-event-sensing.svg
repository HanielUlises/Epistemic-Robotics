<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" font-family="Arial,Helvetica,sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">read-order(i, s)</text>
<text x="16" y="45" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">semi-private sensing</text>
<line x1="172" y1="117" x2="286" y2="117" stroke="#E68026" stroke-width="2"/>
<rect x="90" y="100" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#C8102E" stroke-width="2.6"/>
<text x="130.0" y="121" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">e-here</text>
<rect x="290" y="100" width="92" height="34" rx="6" fill="#FAFAFA" stroke="#C8102E" stroke-width="2.6"/>
<text x="336.0" y="121" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">e-elsewhere</text>
<text x="130" y="154" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">pre: job(s) ∧ ¬at-view(i)</text>
<text x="336" y="154" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">pre: ¬job(s) ∧ ¬at-view(i)</text>
<text x="16" y="200" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">Only the reader tells the outcomes apart; the other robot learns that the</text>
<text x="16" y="218" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">order was read. Both events designated: the policy branches on the order.</text>
