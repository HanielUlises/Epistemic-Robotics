<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" font-family="Arial,Helvetica,sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">tell, ack, ack2, ... (i, j, s), among N robots</text>
<text x="16" y="45" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">a bystander b relates all three events</text>
<line x1="122" y1="107" x2="186" y2="107" stroke="#3373CC" stroke-width="2.2"/>
<text x="154" y="100" font-size="12" fill="#3373CC" text-anchor="middle" font-weight="bold">i</text>
<line x1="268" y1="107" x2="332" y2="107" stroke="#E68026" stroke-width="2.2"/>
<text x="300" y="100" font-size="12" fill="#E68026" text-anchor="middle" font-weight="bold">j</text>
<path d="M 80 124 C 80 178, 374 178, 374 124" fill="none" stroke="#1A8C46" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="227" y="174" font-size="12" fill="#1A8C46" text-anchor="middle" font-weight="bold">b</text>
<rect x="40" y="90" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#C8102E" stroke-width="2.6"/>
<text x="80.0" y="111" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">d</text>
<rect x="188" y="90" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#111111" stroke-width="1.2"/>
<text x="228.0" y="111" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">l</text>
<rect x="334" y="90" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#111111" stroke-width="1.2"/>
<text x="374.0" y="111" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">n</text>
<text x="80" y="78" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">delivered</text>
<text x="228" y="78" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">sent, lost</text>
<text x="374" y="78" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">never sent</text>
<text x="16" y="208" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">A robot that neither sends nor receives cannot tell any event from</text>
<text x="16" y="226" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">any other; only the edge it adds between d and n is drawn. Its</text>
<text x="16" y="244" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">relation is total, an equivalence: the model stays S5.</text>
</svg>
