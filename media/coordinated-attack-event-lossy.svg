<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" font-family="Arial,Helvetica,sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">tell, ack, ack2, ack3 (i, j, s)</text>
<text x="16" y="45" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">lossy message: delivered, lost, or never sent</text>
<line x1="122" y1="117" x2="186" y2="117" stroke="#3373CC" stroke-width="2.2"/>
<text x="154" y="110" font-size="12" fill="#3373CC" text-anchor="middle" font-weight="bold">i</text>
<line x1="268" y1="117" x2="332" y2="117" stroke="#E68026" stroke-width="2.2"/>
<text x="300" y="110" font-size="12" fill="#E68026" text-anchor="middle" font-weight="bold">j</text>
<rect x="40" y="100" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#C8102E" stroke-width="2.6"/>
<text x="80.0" y="121" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">d</text>
<rect x="188" y="100" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#111111" stroke-width="1.2"/>
<text x="228.0" y="121" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">l</text>
<rect x="334" y="100" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#111111" stroke-width="1.2"/>
<text x="374.0" y="121" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">n</text>
<text x="80" y="154" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">pre: π, post: p</text>
<text x="228" y="154" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">pre: π, post: p</text>
<text x="374" y="154" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">pre: true</text>
<text x="80" y="88" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">delivered</text>
<text x="228" y="88" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">sent, lost</text>
<text x="374" y="88" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">never sent</text>
<text x="16" y="200" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">The sender i cannot tell delivered from lost; the receiver j cannot tell</text>
<text x="16" y="218" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">lost from never sent. Only delivery is designated. Both relations are</text>
<text x="16" y="236" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">equivalences: the model stays S5.</text>
</svg>
