<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="The epistemic model at each step of the run: two worlds both designated, then two with one designated after the scan, then three after the private announcement">
  <style>
    .ttl { font-size:13px; font-weight:bold; fill:#111111 }
    .lbl { font-size:11.5px; fill:#5A5A5A }
    .cap { font-size:11.5px; fill:#5A5A5A; font-style:italic }
    .wid { font-family:'Courier New',Courier,monospace; font-size:11px; fill:#111111 }
    .ag  { font-family:'Courier New',Courier,monospace; font-size:10px; fill:#1A52A0 }
    .val { font-family:'Courier New',Courier,monospace; font-size:11.5px; fill:#111111 }
  </style>
<text x="30" y="26" class="ttl">Initial</text>
<text x="30" y="44" class="lbl">2 worlds, 2 designated</text>
<text x="30" y="345" class="cap">Nobody knows whether the site is contaminated.</text>
<text x="330" y="26" class="ttl">After scan_relay</text>
<text x="330" y="44" class="lbl">2 worlds, 1 designated</text>
<text x="330" y="345" class="cap">Sensing narrows: the scan settles which world is actual.</text>
<text x="630" y="26" class="ttl">After relay-dirty</text>
<text x="630" y="44" class="lbl">3 worlds, 1 designated</text>
<text x="630" y="345" class="cap">Private speech widens: a world is added, not removed.</text>
