<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 350" width="896" height="350" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Model size and each agent's epistemic state after every step">
<style>
  .lbl  { font-size:11.5px; fill:#5A5A5A }
  .ttl  { font-size:13px; font-weight:bold; fill:#111111 }
  .cap  { font-size:11.5px; fill:#5A5A5A; font-style:italic }
  .wid  { font-family:'Courier New',Courier,monospace; font-size:11px; fill:#111111 }
  .atom { font-family:'Courier New',Courier,monospace; font-size:9.5px; fill:#5A5A5A }
  .atomh{ font-family:'Courier New',Courier,monospace; font-size:9.5px;
           fill:none; stroke:#FAFAFA; stroke-width:3; stroke-linejoin:round }
  .node { fill:#FFFFFF; stroke:#5A5A5A; stroke-width:1.4 }
  .des  { fill:#FFFFFF; stroke:#C8102E; stroke-width:2.6 }
  .act  { fill:#FDECEF; stroke:#C8102E; stroke-width:2.6 }
  .arc  { stroke:#1A52A0; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .arc2 { stroke:#1A52A0; stroke-width:1.3; fill:none;
           marker-end:url(#a); marker-start:url(#b) }
  .loop { stroke:#1A52A0; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .axis { stroke:#D6D6D6; stroke-width:1 }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6"
    markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1A52A0"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="6"
    markerHeight="6" orient="auto">
    <path d="M10,0 L0,5 L10,10 z" fill="#1A52A0"/></marker>
</defs>
<text class="lbl" x="206" y="40" text-anchor="middle">initial</text>
<text class="lbl" x="354" y="40" text-anchor="middle">deploy</text>
<text class="atom" x="354" y="54" text-anchor="middle">step 1</text>
<text class="lbl" x="502" y="40" text-anchor="middle">inspect</text>
<text class="atom" x="502" y="54" text-anchor="middle">step 2</text>
<text class="lbl" x="650" y="40" text-anchor="middle">brief-leak</text>
<text class="atom" x="650" y="54" text-anchor="middle">step 3</text>
<text class="lbl" x="798" y="40" text-anchor="middle">contain</text>
<text class="atom" x="798" y="54" text-anchor="middle">step 4</text>
<text class="ttl" x="12" y="100">model</text>
<text class="lbl" x="12" y="114">worlds</text>
<rect x="138" y="82" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6"/>
<text class="wid" x="206" y="106" text-anchor="middle">|W| = 2</text>
<rect x="286" y="82" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6"/>
<text class="wid" x="354" y="106" text-anchor="middle">|W| = 2</text>
<rect x="434" y="82" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6"/>
<text class="wid" x="502" y="106" text-anchor="middle">|W| = 2</text>
<rect x="582" y="82" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6"/>
<text class="wid" x="650" y="106" text-anchor="middle">|W| = 4</text>
<rect x="730" y="82" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6"/>
<text class="wid" x="798" y="106" text-anchor="middle">|W| = 5</text>
<text class="ttl" x="12" y="146">inspector</text>
<rect x="138" y="128" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="206" y="146" text-anchor="middle">|D| = 2</text>
<text class="atom" x="206" y="158" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="286" y="128" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="354" y="146" text-anchor="middle">|D| = 2</text>
<text class="atom" x="354" y="158" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="434" y="128" width="136" height="32" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text class="wid" x="502" y="146" text-anchor="middle">|D| = 1</text>
<text class="atom" x="502" y="158" text-anchor="middle" fill="#5A5A5A">knows</text>
<rect x="582" y="128" width="136" height="32" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text class="wid" x="650" y="146" text-anchor="middle">|D| = 1</text>
<text class="atom" x="650" y="158" text-anchor="middle" fill="#5A5A5A">knows</text>
<rect x="730" y="128" width="136" height="32" rx="3" fill="#FDECEF" stroke="#C8102E" stroke-width="2"/>
<text class="wid" x="798" y="146" text-anchor="middle">|D| = 1</text>
<text class="atom" x="798" y="158" text-anchor="middle" fill="#C8102E">believes wrongly</text>
<text class="ttl" x="12" y="192">porter</text>
<rect x="138" y="174" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="206" y="192" text-anchor="middle">|D| = 2</text>
<text class="atom" x="206" y="204" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="286" y="174" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="354" y="192" text-anchor="middle">|D| = 2</text>
<text class="atom" x="354" y="204" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="434" y="174" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="502" y="192" text-anchor="middle">|D| = 2</text>
<text class="atom" x="502" y="204" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="582" y="174" width="136" height="32" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text class="wid" x="650" y="192" text-anchor="middle">|D| = 1</text>
<text class="atom" x="650" y="204" text-anchor="middle" fill="#5A5A5A">knows</text>
<rect x="730" y="174" width="136" height="32" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
<text class="wid" x="798" y="192" text-anchor="middle">|D| = 1</text>
<text class="atom" x="798" y="204" text-anchor="middle" fill="#5A5A5A">knows</text>
<text class="ttl" x="12" y="238">guest</text>
<rect x="138" y="220" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="206" y="238" text-anchor="middle">|D| = 2</text>
<text class="atom" x="206" y="250" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="286" y="220" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="354" y="238" text-anchor="middle">|D| = 2</text>
<text class="atom" x="354" y="250" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="434" y="220" width="136" height="32" rx="3" fill="#FAFAFA" stroke="#D6D6D6" stroke-width="1.2"/>
<text class="wid" x="502" y="238" text-anchor="middle">|D| = 2</text>
<text class="atom" x="502" y="250" text-anchor="middle" fill="#5A5A5A">uncertain</text>
<rect x="582" y="220" width="136" height="32" rx="3" fill="#FDECEF" stroke="#C8102E" stroke-width="2"/>
<text class="wid" x="650" y="238" text-anchor="middle">|D| = 2</text>
<text class="atom" x="650" y="250" text-anchor="middle" fill="#C8102E">believes wrongly</text>
<rect x="730" y="220" width="136" height="32" rx="3" fill="#FDECEF" stroke="#C8102E" stroke-width="2"/>
<text class="wid" x="798" y="238" text-anchor="middle">|D| = 2</text>
<text class="atom" x="798" y="250" text-anchor="middle" fill="#C8102E">believes wrongly</text>
<text class="cap" x="12" y="286">|W| is the size of the model the fleet shares; |D| is the number of worlds an agent still designates, so |D| = 1 is knowledge and |D| &gt; 1 is uncertainty.</text>
<text class="cap" x="12" y="304">A red cell marks a perspective that no longer contains the world that is the case, which is where the accessibility relation stops being reflexive and the frame</text>
<text class="cap" x="12" y="322">ceases to be S5.</text>
</svg>