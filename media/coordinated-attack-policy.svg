<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial,Helvetica,sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">The policy on the beacon floor</text>
<text x="16" y="45" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">depth 5, two leaves, 115 AO* expansions; the radio is in the domain and unused</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5A5A"/></marker></defs>
<rect x="285.0" y="64" width="150" height="28" rx="4" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="360" y="82" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">go-view(north)</text>
<line x1="360" y1="92" x2="360" y2="108" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="265.0" y="110" width="190" height="28" rx="4" fill="#FAFAFA" stroke="#C8102E" stroke-width="2.2"/>
<text x="360" y="128" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">read-order(south, s1)</text>
<line x1="360" y1="138" x2="200" y2="164" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="218.0" y="148" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">e-here</text>
<rect x="125.0" y="166" width="150" height="28" rx="4" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="200" y="184" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">go-view(south)</text>
<line x1="200" y1="194" x2="200" y2="210" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="115.0" y="212" width="170" height="28" rx="4" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="200" y="230" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">signal(south, s1)</text>
<line x1="200" y1="240" x2="200" y2="256" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="145.0" y="258" width="110" height="28" rx="4" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="200" y="276" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">lift(s1)</text>
<text x="90" y="230" font-size="12" fill="#C8102E" text-anchor="middle" font-weight="bold">E⁰ → C</text>
<line x1="360" y1="138" x2="520" y2="164" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="502.0" y="148" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">e-elsewhere</text>
<rect x="445.0" y="166" width="150" height="28" rx="4" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="520" y="184" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">go-view(south)</text>
<line x1="520" y1="194" x2="520" y2="210" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="435.0" y="212" width="170" height="28" rx="4" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="520" y="230" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">signal(south, s2)</text>
<line x1="520" y1="240" x2="520" y2="256" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="465.0" y="258" width="110" height="28" rx="4" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="520" y="276" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">lift(s2)</text>
<text x="630" y="230" font-size="12" fill="#C8102E" text-anchor="middle" font-weight="bold">E⁰ → C</text>
</svg>
