<text x="30" y="434" class="lbl">Red ring: a designated world &#8212; one the model says may be the actual one.</text>
<text x="30" y="451" class="lbl">Sensing contracts the model: an observation rules a world out.</text>
<text x="30" y="468" class="lbl">Private speech expands it: the agents outside the audience must go on considering possible a world in which nothing was said.</text>
