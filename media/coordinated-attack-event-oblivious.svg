<line x1="268" y1="107" x2="330" y2="107" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 360 90 C 352 62, 396 62, 388 88" fill="none" stroke="#8A8A8A" stroke-width="2" marker-end="url(#ah)"/>
<text x="227" y="174" font-size="12" fill="#8A8A8A" text-anchor="middle" font-weight="bold">b</text>
<rect x="40" y="90" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#C8102E" stroke-width="2.6"/>
<text x="80.0" y="111" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">d</text>
<rect x="188" y="90" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#111111" stroke-width="1.2"/>
<text x="228.0" y="111" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">l</text>
<rect x="334" y="90" width="80" height="34" rx="6" fill="#FAFAFA" stroke="#111111" stroke-width="1.2"/>
<text x="374.0" y="111" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">n</text>
<text x="80" y="78" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">delivered</text>
<text x="228" y="78" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">sent, lost</text>
<text x="16" y="208" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">Every event is mapped onto n, and d onto nothing else. At the</text>
<text x="16" y="226" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">delivered copy b considers only worlds where nothing was sent: it</text>
<text x="16" y="244" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">believes the log p false while p holds, and the model leaves S5.</text>
