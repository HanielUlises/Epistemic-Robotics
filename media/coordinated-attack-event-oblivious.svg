<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">The same message, bystander Oblivious</text>
<text x="16" y="45" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">the type the library has, and why it is not used</text>
