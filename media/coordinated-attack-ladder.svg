<text x="72" y="228" font-size="13" fill="#111111" text-anchor="end" font-weight="bold">E¹</text>
<line x1="80" y1="188" x2="740" y2="188" stroke="#E6E6E6" stroke-width="1"/>
<text x="72" y="192" font-size="13" fill="#111111" text-anchor="end" font-weight="bold">E²</text>
<line x1="80" y1="152" x2="740" y2="152" stroke="#E6E6E6" stroke-width="1"/>
<text x="72" y="156" font-size="13" fill="#111111" text-anchor="end" font-weight="bold">E³</text>
