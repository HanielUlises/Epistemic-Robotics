<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Arial,Helvetica,sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">Depth of mutual knowledge of job(s₁), after each action</text>
<text x="16" y="45" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">computed from the model after every product update; the same figures the run logged</text>
