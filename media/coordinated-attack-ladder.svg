<text x="675.0" y="74" font-size="10" fill="#5A5A5A" text-anchor="middle" font-weight="normal">one update</text>
<text x="301.0" y="304" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">radio floor: four messages, all delivered</text>
