<text x="301.0" y="182" font-size="10" fill="#5A5A5A" text-anchor="middle" font-weight="normal">6 worlds</text>
<rect x="354" y="152" width="70" height="110" fill="#1A8C46" opacity="0.74"/>
<text x="389.0" y="278" font-size="11" fill="#111111" text-anchor="middle" font-weight="normal">ack2</text>
<text x="389.0" y="146" font-size="10" fill="#5A5A5A" text-anchor="middle" font-weight="normal">8 worlds</text>
<rect x="442" y="116" width="70" height="146" fill="#1A8C46" opacity="0.87"/>
<text x="477.0" y="278" font-size="11" fill="#111111" text-anchor="middle" font-weight="normal">ack3</text>
<text x="477.0" y="110" font-size="10" fill="#5A5A5A" text-anchor="middle" font-weight="normal">10 worlds</text>
<rect x="530" y="230" width="70" height="22" fill="none" stroke="#C8102E" stroke-dasharray="4 3"/>
