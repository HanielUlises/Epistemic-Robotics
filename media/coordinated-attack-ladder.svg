<text x="565.0" y="278" font-size="11" fill="#111111" text-anchor="middle" font-weight="normal">lift(s₁)</text>
<line x1="620" y1="70" x2="620" y2="270" stroke="#BBBBBB" stroke-width="1"/>
<rect x="640" y="258" width="70" height="2" fill="#1A8C46"/>
<rect x="640" y="80" width="70" height="182" fill="#C8102E" opacity="0.85"/>
