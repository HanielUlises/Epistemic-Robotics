<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" font-family="Arial,Helvetica,sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">lift(s)</text>
<text x="16" y="45" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">public ontic, joint</text>
<rect x="170" y="100" width="120" height="34" rx="6" fill="#FAFAFA" stroke="#C8102E" stroke-width="2.6"/>
<text x="230.0" y="121" text-anchor="middle" font-family="Courier New,monospace" font-size="12" fill="#111111">e-lift</text>
<text x="230" y="154" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">pre: job(s) ∧ C_{south,north} job(s)</text>
<text x="230" y="172" font-size="11" fill="#5A5A5A" text-anchor="middle" font-weight="normal">post: lifted</text>
<text x="16" y="210" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">A robot raises its end only if it knows the other raises the other.</text>
<text x="16" y="228" font-size="12" fill="#5A5A5A" text-anchor="start" font-weight="normal">The weakest condition that settles both is common knowledge.</text>
