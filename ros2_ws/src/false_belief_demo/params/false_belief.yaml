# The false-belief demonstration, as parameters. The launch file substitutes
# the upper-case names with installed paths before handing this over.
#
# Both the planner and the epistemic state are given the beliefs library
# beside the intermediate one; a list here replaces the packaged default, so
# both are named. The planner refuses any update that leaves a robot with no
# consistent belief: a policy may not rely on the picker believing everything.

planner:
  ros__parameters:
    plan_solver_plugins: ["EPISTEMIC"]
    EPISTEMIC:
      plugin: "plansys2/EpistemicPlanSolver"
      epddl_domain: "EPDDL_DOMAIN"
      epddl_problem: "EPDDL_PROBLEM"
      epddl_libraries: ["INTERMEDIATE_LIBRARY", "BELIEFS_LIBRARY"]
      action_mapping: "MAPPING_FILE"
      strategy: "aostar"
      conditional_plan: "policy"
      consistent_beliefs: true
    plan_solver_timeout: 120.0

executor:
  ros__parameters:
    bt_builder_plugin: "EpistemicBTBuilder"
    bt_node_plugins: ["libplansys2_epistemic_bt_nodes.so"]
    action_timeouts:
      actions: ["go_dock", "relocate", "report", "look", "fetch"]
      go_dock:
        duration_overrun_percentage: 1000.0
      relocate:
        duration_overrun_percentage: 1000.0
      report:
        duration_overrun_percentage: 2000.0
      look:
        duration_overrun_percentage: 1000.0
      fetch:
        duration_overrun_percentage: 1000.0

epistemic_state:
  ros__parameters:
    epddl_domain: "EPDDL_DOMAIN"
    epddl_problem: "EPDDL_PROBLEM"
    epddl_libraries: ["INTERMEDIATE_LIBRARY", "BELIEFS_LIBRARY"]
