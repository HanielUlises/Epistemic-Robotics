# The muddy robots, as parameters. The launch file substitutes the upper-case
# names with installed or generated paths before handing this over.

planner:
  ros__parameters:
    plan_solver_plugins: ["EPISTEMIC"]
    EPISTEMIC:
      plugin: "plansys2/EpistemicPlanSolver"
      epddl_domain: "EPDDL_DOMAIN"
      epddl_problem: "EPDDL_PROBLEM"
      epddl_libraries: ["INTERMEDIATE_LIBRARY"]
      action_mapping: "MAPPING_FILE"
      strategy: "aostar"
      conditional_plan: "policy"
    plan_solver_timeout: 60.0

executor:
  ros__parameters:
    bt_builder_plugin: "EpistemicBTBuilder"
    bt_node_plugins: ["libplansys2_epistemic_bt_nodes.so"]
    action_timeouts:
      actions: ["announce", "bell"]
      announce:
        duration_overrun_percentage: 1000.0
      bell:
        duration_overrun_percentage: 3000.0

epistemic_state:
  ros__parameters:
    epddl_domain: "EPDDL_DOMAIN"
    epddl_problem: "EPDDL_PROBLEM"
    epddl_libraries: ["INTERMEDIATE_LIBRARY"]
