# The fleet that runs the larger warehouse, in the shape rmf_demos' fleet
# adapter expects.
#
# Three robots rather than the small floor's two. Thirty-four aisles is enough
# that a single searcher makes the run a long errand rather than a
# demonstration, and a third agent is what lets the floor be divided and the
# division be reasoned about.
#
# Every robot starts on a charger and not on a dock. A zone in the domain is a
# region several agents may occupy at once and a waypoint in RMF holds exactly
# one robot, so parking an idle robot on a named destination makes another
# robot's last leg impossible: RMF reports "Failed negotiation" forever,
# because the goal is held by a robot with no reason to move. The small
# warehouse demo learnt this and the same rule applies here.

rmf_fleet:
  name: "warehouseXL"
  fleet_manager:
    ip: "127.0.0.1"
    port: 22021
    user: "some_user"
    password: "some_password"
  limits:
    linear: [0.5, 0.75]
    angular: [0.6, 2.0]
  profile:
    footprint: 0.3
    vicinity: 0.5
  reversible: True
  battery_system:
    voltage: 12.0
    capacity: 24.0
    charging_current: 5.0
  mechanical_system:
    mass: 20.0
    moment_of_inertia: 10.0
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0
  tool_system:
    power: 0.0
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0
  account_for_battery_drain: True
  task_capabilities:
    loop: True
    delivery: False
    clean: False
    finishing_request: "nothing"

robots:
  r1:
    robot_config:
      max_delay: 15.0
    rmf_config:
      robot_state_update_frequency: 10.0
      start:
        map_name: "L1"
        waypoint: "charger_east_south"
        orientation: 0.0
      charger:
        waypoint: "charger_east_south"
  r2:
    robot_config:
      max_delay: 15.0
    rmf_config:
      robot_state_update_frequency: 10.0
      start:
        map_name: "L1"
        waypoint: "charger_west_south"
        orientation: 0.0
      charger:
        waypoint: "charger_west_south"
  r3:
    robot_config:
      max_delay: 15.0
    rmf_config:
      robot_state_update_frequency: 10.0
      start:
        map_name: "L1"
        waypoint: "charger_east_north"
        orientation: 0.0
      charger:
        waypoint: "charger_east_north"
