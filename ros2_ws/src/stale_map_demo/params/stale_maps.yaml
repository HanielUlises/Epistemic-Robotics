# The stale-maps mission, as parameters. The launch file substitutes the
# upper-case names with installed paths before handing this over.
#
# Both the planner and the epistemic state are given the maps library beside
# the intermediate one; a list here replaces the packaged default, so both
# are named. The planner refuses any update that leaves a robot with no
# consistent belief, which is what a map taken as fact would do.

planner:
  ros__parameters:
    plan_solver_plugins: ["EPISTEMIC"]
    EPISTEMIC:
      plugin: "plansys2/EpistemicPlanSolver"
      epddl_domain: "EPDDL_DOMAIN"
      epddl_problem: "EPDDL_PROBLEM"
      epddl_libraries: ["INTERMEDIATE_LIBRARY", "MAPS_LIBRARY"]
      action_mapping: "MAPPING_FILE"
      # Every action of this domain is deterministic, so the policy is a
      # sequence. AO* deepens over 390 ground actions and spends its whole
      # budget before depth 8. Replanning finds the eight steps in eight
      # expansions and returns them as a policy, which the epistemic
      # executor needs; GBFS finds them as fast and returns a flat plan
      # without the epistemic fields, on which every update fails.
      strategy: "replan"
      conditional_plan: "policy"
      consistent_beliefs: true
    plan_solver_timeout: 120.0

executor:
  ros__parameters:
    bt_builder_plugin: "EpistemicBTBuilder"
    bt_node_plugins: ["libplansys2_epistemic_bt_nodes.so"]
    # A haul of fifty-odd metres at half a metre a second, with room; the
    # forklift waits for every observer's map to read its change.
    action_timeouts:
      actions: ["stage", "clear", "send_open", "send_blocked", "cross"]
      stage:
        duration_overrun_percentage: 500.0
      clear:
        duration_overrun_percentage: 500.0
      send_open:
        duration_overrun_percentage: 2000.0
      send_blocked:
        duration_overrun_percentage: 2000.0
      cross:
        duration_overrun_percentage: 500.0

epistemic_state:
  ros__parameters:
    epddl_domain: "EPDDL_DOMAIN"
    epddl_problem: "EPDDL_PROBLEM"
    epddl_libraries: ["INTERMEDIATE_LIBRARY", "MAPS_LIBRARY"]
