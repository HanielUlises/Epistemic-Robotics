# ePlanSys over the six-room building.
#
# Everything the demo does beyond driving is configuration, and this is it. The
# planner is given the EPDDL pair; the epistemic state is given the same pair,
# so that policy and model speak one vocabulary; and perception is given the
# two rooms, each named with the sensing action whose outcome it reports.

plansys2:
  ros__parameters:
    use_real_time: false

planner_client:
  ros__parameters:
    plan_solver_timeout: 30.0

planner:
  ros__parameters:
    plan_solver_timeout: 30.0
    plan_solver_plugins: ["EPISTEMIC"]
    EPISTEMIC:
      plugin: "plansys2/EpistemicPlanSolver"
      epddl_domain: "EPDDL_DOMAIN"
      epddl_problem: "EPDDL_PROBLEM"
      plank_command: ""
      task_file: ""
      heuristic: ""
      strategy: ""
      policy_file: ""
      action_mapping: "ACTION_MAPPING"
      conditional_plan: "policy"

executor:
  ros__parameters:
    bt_builder_plugin: "EpistemicBTBuilder"
    bt_node_plugins: ["libplansys2_epistemic_bt_nodes.so"]

# The same two EPDDL files the solver is given. Naming them twice is
# deliberate: the state grounds them itself rather than being handed the
# planner's task, so the two nodes do not depend on each other's start-up
# order. What has to agree is the problem.
epistemic_state:
  ros__parameters:
    epddl_domain: "EPDDL_DOMAIN"
    epddl_problem: "EPDDL_PROBLEM"

# The map, read as knowledge.
#
# Two regions, one per room of the east wing, in metres in the map frame. Each
# names the atom its occupancy decides and the sensing action whose outcome it
# reports, so an observation arrives as the event the policy branched on rather
# than as an announcement from nowhere.
#
# Room 3 holds an L-shaped partition and room 6 is empty, so the two rooms
# report different outcomes -- which is what makes both branches of the policy
# worth watching.
epistemic_perception:
  ros__parameters:
    map_topic: "/map"
    regions: ["room3", "room6"]

    # Deep enough into the room that the doorway does not reveal it. Perception
    # reports the moment a region resolves, and a refusal is final -- the node
    # treats a rejected call as reported and does not try again. So a region
    # visible from the approach resolves while the executor has not yet applied
    # the drive's epistemic update, the state refuses an observation from a
    # robot it does not yet believe is at the door, and that observation is
    # lost. Out of sight from the corridor, the region resolves during the
    # look, which is when the model is ready for it.
    #
    # The patch of room 3 the robot can actually settle from the doorway. The
    # burger's laser reaches 3.5 m, so naming the whole 7.5 m room would leave
    # most of it unobserved for ever: the region would stay undecided and
    # nothing would ever be reported. What the atom means is therefore what a
    # robot at the door can determine -- whether the entry is passable.
    room3:
      boxes: [5.2, 0.8, 7.0, 2.4]
      atom: "blocked-r3"
      atom_true_when_clear: false
      sensing_action: "inspect3_r1"
      outcome_when_clear: "e-inspect3-clear"
      outcome_when_blocked: "e-inspect3-blocked"

    room6:
      boxes: [4.9, -1.6, 5.8, -0.8]
      atom: "blocked-r6"
      atom_true_when_clear: false
      sensing_action: "inspect6_r1"
      outcome_when_clear: "e-inspect6-clear"
      outcome_when_blocked: "e-inspect6-blocked"

    # nav2 and slam_toolbox convention. A cell between the two has been seen
    # without being settled and counts as unobserved: calling it free would
    # hand the robot knowledge it does not have.
    free_below: 25
    occupied_above: 65
