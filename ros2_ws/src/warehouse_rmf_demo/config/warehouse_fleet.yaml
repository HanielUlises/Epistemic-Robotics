# The fleet that runs the warehouse mission, in the shape rmf_demos'
# fleet adapter expects.
#
# Two robots, because the mission is `warehouse-problem.epddl`: r1 goes and
# looks, r2 waits at receiving and has to come to know what r1 found. r2 never
# moves, and that is the point of the instance rather than an oversight.
#
# r2 parks at r2_charger and not at dock_north, though the domain says it is in
# zone dock_north and the mission node tells PlanSys2 so. The two statements do
# not contradict each other: a zone in the domain is a region several agents
# can occupy at once, and a waypoint in RMF holds one robot. Parking r2 on the
# delivery waypoint makes r1's last leg impossible -- RMF reports "Failed
# negotiation" forever, because the goal is occupied by a robot with no reason
# to move -- and the mission never finishes.

rmf_fleet:
  name: "warehouseBot"
  fleet_manager:
    ip: "127.0.0.1"
    port: 22021
    user: "some_user"
    password: "some_password"
  limits:
    linear: [0.5, 0.75]
    angular: [0.6, 2.0]
  profile:
    footprint: 0.3
    vicinity: 0.5
  reversible: True
  battery_system:
    voltage: 12.0
    capacity: 24.0
    charging_current: 5.0
  mechanical_system:
    mass: 20.0
    moment_of_inertia: 10.0
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0
  tool_system:
    power: 0.0
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0
  account_for_battery_drain: True
  task_capabilities:
    loop: True
    delivery: False
    clean: False
    finishing_request: "nothing"

robots:
  r1:
    robot_config:
      max_delay: 15.0
    rmf_config:
      robot_state_update_frequency: 10.0
      start:
        map_name: "L1"
        waypoint: "dock_south"
        orientation: 0.0
      charger:
        waypoint: "r1_charger"
  r2:
    robot_config:
      max_delay: 15.0
    rmf_config:
      robot_state_update_frequency: 10.0
      start:
        map_name: "L1"
        waypoint: "r2_charger"
        orientation: 0.0
      charger:
        waypoint: "r2_charger"
