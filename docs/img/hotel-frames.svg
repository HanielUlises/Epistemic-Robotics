<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 306"
     width="754" height="306"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-label="Each agent's accessibility relation measured as a graph at every step">
  <style>
    .cell  { fill:#FFFFFF; stroke:#E2E2E2; stroke-width:1 }
    .left  { fill:#FFF5F6; stroke:#C8102E; stroke-width:1.5 }
    .n     { font-family:'Courier New',Courier,monospace; font-size:12.5px;
             fill:#111111 }
    .sub   { font-family:'Courier New',Courier,monospace; font-size:10px;
             fill:#7A7A7A }
    .bad   { fill:#C8102E }
    .head  { font-size:11.5px; fill:#5A5A5A }
    .step  { font-family:'Courier New',Courier,monospace; font-size:10px;
             fill:#9A9A9A }
    .agent { font-size:12.5px; font-weight:bold; fill:#111111 }
  </style>
  <text class="head" x="207" y="32" text-anchor="middle">initial</text>
  <text class="step" x="207" y="46" text-anchor="middle"></text>
  <text class="head" x="325" y="32" text-anchor="middle">deploy</text>
  <text class="step" x="325" y="46" text-anchor="middle">step 1</text>
  <text class="head" x="443" y="32" text-anchor="middle">inspect</text>
  <text class="step" x="443" y="46" text-anchor="middle">step 2</text>
  <text class="head" x="561" y="32" text-anchor="middle">brief-leak</text>
  <text class="step" x="561" y="46" text-anchor="middle">step 3</text>
  <text class="head" x="679" y="32" text-anchor="middle">contain</text>
  <text class="step" x="679" y="46" text-anchor="middle">step 4</text>
  <text class="agent" x="16" y="93">inspector</text>
  <rect class="cell" x="148" y="62" width="112" height="46" rx="3"/>
  <text class="n" x="204" y="82" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="204" y="97" text-anchor="middle">S5, 1 class</text>
  <rect class="cell" x="266" y="62" width="112" height="46" rx="3"/>
  <text class="n" x="322" y="82" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="322" y="97" text-anchor="middle">S5, 1 class</text>
  <rect class="cell" x="384" y="62" width="112" height="46" rx="3"/>
  <text class="n" x="440" y="82" text-anchor="middle">|R| = 2</text>
  <text class="sub" x="440" y="97" text-anchor="middle">S5, 2 classes</text>
  <rect class="cell" x="502" y="62" width="112" height="46" rx="3"/>
  <text class="n" x="558" y="82" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="558" y="97" text-anchor="middle">S5, 4 classes</text>
  <rect class="left" x="620" y="62" width="112" height="46" rx="3"/>
  <text class="n" x="676" y="82" text-anchor="middle">|R| = 5</text>
  <text class="sub bad" x="676" y="97" text-anchor="middle">KD45, 4 classes</text>
  <text class="agent" x="16" y="147">porter</text>
  <rect class="cell" x="148" y="116" width="112" height="46" rx="3"/>
  <text class="n" x="204" y="136" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="204" y="151" text-anchor="middle">S5, 1 class</text>
  <rect class="cell" x="266" y="116" width="112" height="46" rx="3"/>
  <text class="n" x="322" y="136" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="322" y="151" text-anchor="middle">S5, 1 class</text>
  <rect class="cell" x="384" y="116" width="112" height="46" rx="3"/>
  <text class="n" x="440" y="136" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="440" y="151" text-anchor="middle">S5, 1 class</text>
  <rect class="cell" x="502" y="116" width="112" height="46" rx="3"/>
  <text class="n" x="558" y="136" text-anchor="middle">|R| = 6</text>
  <text class="sub" x="558" y="151" text-anchor="middle">S5, 3 classes</text>
  <rect class="cell" x="620" y="116" width="112" height="46" rx="3"/>
  <text class="n" x="676" y="136" text-anchor="middle">|R| = 7</text>
  <text class="sub" x="676" y="151" text-anchor="middle">S5, 4 classes</text>
  <text class="agent" x="16" y="201">guest</text>
  <rect class="cell" x="148" y="170" width="112" height="46" rx="3"/>
  <text class="n" x="204" y="190" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="204" y="205" text-anchor="middle">S5, 1 class</text>
  <rect class="cell" x="266" y="170" width="112" height="46" rx="3"/>
  <text class="n" x="322" y="190" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="322" y="205" text-anchor="middle">S5, 1 class</text>
  <rect class="cell" x="384" y="170" width="112" height="46" rx="3"/>
  <text class="n" x="440" y="190" text-anchor="middle">|R| = 4</text>
  <text class="sub" x="440" y="205" text-anchor="middle">S5, 1 class</text>
  <rect class="left" x="502" y="170" width="112" height="46" rx="3"/>
  <text class="n" x="558" y="190" text-anchor="middle">|R| = 8</text>
  <text class="sub bad" x="558" y="205" text-anchor="middle">KD45, 1 class</text>
  <rect class="left" x="620" y="170" width="112" height="46" rx="3"/>
  <text class="n" x="676" y="190" text-anchor="middle">|R| = 10</text>
  <text class="sub bad" x="676" y="205" text-anchor="middle">KD45, 1 class</text>
  <text class="sub" x="16" y="238">|R| counts the edges of the agent&#8217;s accessibility relation;</text>
  <text class="sub" x="16" y="251">classes counts the distinct sets of worlds it considers possible.</text>
  <text class="sub" x="16" y="264">A red cell marks a step at which the relation is no longer reflexive:</text>
  <text class="sub" x="16" y="277">the frame has left S5, and what the agent holds is belief, which may be false.</text>
</svg>